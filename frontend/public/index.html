
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
<meta name="google-site-verification" content="3gJ-OCd2hkxbzZ-rn-0jTjNOXp4LbT8dAUWN9B0yT2I" />
  <title>Atlasia Kids</title>
<meta name="description" content="Atlasia Kids - Le monde des enfants" />

<meta property="og:title" content="Atlasia Kids" />
<meta property="og:description" content="Atlasia Kids - Le monde des enfants" />
<meta property="og:url" content="https://atlasiakids.fr/" />
<meta property="og:type" content="website" />
<meta property="og:image" content="https://atlasiakids.fr/images/logo-atlasia-france.png" />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: "Poppins", sans-serif !important;
    }

    button {
      position: relative;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    button .bubble {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(255, 255, 255, 0.9) 0%,
        rgba(255, 255, 255, 0.45) 45%,
        rgba(255, 255, 255, 0) 75%
      );
      pointer-events: none;
      animation: bubbleUp 1s ease-out forwards;
    }

    @keyframes bubbleUp {
      0% {
        transform: translate(0, 0) scale(0.3);
        opacity: 1;
      }

      100% {
        transform: translate(var(--moveX), -90px) scale(1.4);
        opacity: 0;
      }
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script>
    function spawnBubbles(e) {
      const btn = e.target.closest("button");
      if (!btn) return;

      const rect = btn.getBoundingClientRect();

      const x =
        (e.touches ? e.touches[0].clientX : e.clientX) -
        rect.left;

      const y =
        (e.touches ? e.touches[0].clientY : e.clientY) -
        rect.top;

      for (let i = 0; i < 8; i++) {
        const bubble = document.createElement("span");

        bubble.classList.add("bubble");

        const size = Math.random() * 12 + 6;

        bubble.style.width = size + "px";
        bubble.style.height = size + "px";
        bubble.style.left = x + "px";
        bubble.style.top = y + "px";

        bubble.style.setProperty(
          "--moveX",
          `${(Math.random() - 0.5) * 160}px`
        );

        btn.appendChild(bubble);

        setTimeout(() => bubble.remove(), 1000);
      }
    }

    document.addEventListener(
      "pointerdown",
      spawnBubbles,
      { passive: true }
    );

    document.addEventListener(
      "touchstart",
      spawnBubbles,
      { passive: true }
    );
  </script>
</body>
</html>
